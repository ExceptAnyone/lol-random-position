<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>롤 포지션 랜덤 배치</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>롤 포지션 랜덤 배치</h1>
    <p class="desc">친구들 이름을 입력하고 버튼을 누르면 포지션이 랜덤으로 배정됩니다.</p>

    <section class="card">
      <h2>참가자</h2>
      <div id="name-inputs" class="name-inputs"></div>
      <div class="actions">
        <button id="shuffle-btn" class="primary">랜덤 배치</button>
        <button id="clear-btn" class="secondary">초기화</button>
      </div>
      <p id="message" class="message" role="alert"></p>
    </section>

    <section class="card">
      <h2>결과</h2>
      <ul id="result" class="result"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
